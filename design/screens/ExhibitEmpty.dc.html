<div style="min-height: 100vh; background: #EFEFEF; color: #1B1D26; font-family: Raleway, 'Helvetica Neue', sans-serif">

          <span style="font-size: 14px; line-height: 1.5; color: #43454F">Eine oder mehrere Personen mit Kontaktdaten und Bild</span>

    <section aria-labelledby="h-staff" style="padding: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(27,29,38,0.07)">

      <button type="button" style="margin-left: auto; height: 36px; padding: 0 16px; border: 1px solid #1B1D26; border-radius: 999px; background: transparent; color: #1B1D26; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">+ Betreuer hinzufügen</button>
