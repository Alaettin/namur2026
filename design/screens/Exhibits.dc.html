<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Exponate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Raleway:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: 100vh; background: #EFEFEF; color: #1B1D26; font-family: Raleway, 'Helvetica Neue', sans-serif">
  <dc-import name="AppHeader" active="exhibits" admin="{{yes}}" user="K. Hollmann" hint-size="100%,104px"></dc-import>
  <main style="max-width: 992px; margin: 0 auto; padding: 40px 16px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <h1 style="margin: 0; font-weight: 700; font-size: 36px; letter-spacing: -0.02em; line-height: 1.1">Exponate</h1>
      <a href="ExhibitEmpty.dc.html" style="height: 44px; padding: 0 22px; display: flex; align-items: center; border-radius: 999px; background: #00A587; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">Exponat anlegen</a>
    </div>
    <div style="overflow-x: auto; background: #FFFFFF; box-shadow: 0 2px 6px rgba(27,29,38,0.07)">
      <table style="width: 100%; min-width: 860px; border-collapse: collapse; font-size: 14px">
        <thead>
          <tr style="text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #5E606C">
            <th style="padding: 14px 16px; font-weight: 600">Kennung</th>
            <th style="padding: 14px 16px; font-weight: 600">Name</th>
            <th style="padding: 14px 16px; font-weight: 600">Inhalte</th>
            <th style="padding: 14px 16px; font-weight: 600">Betreuer</th>
            <th style="padding: 14px 16px; font-weight: 600">Besucher</th>
            <th style="padding: 14px 16px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Aktion</span></th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <tr>
              <td style="padding: 14px 16px; border-top: 1px solid #E3E4E7; font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{r.id}}</td>
              <td style="padding: 14px 16px; border-top: 1px solid #E3E4E7">
                <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px">
                  <span style="font-weight: 600">{{r.name}}</span>
                  <sc-if value="{{r.empty}}" hint-placeholder-val="{{false}}"><span style="height: 20px; padding: 0 8px; display: inline-flex; align-items: center; background: #C24E1E; color: #FFFFFF; font-size: 10px; font-weight: 700; letter-spacing: 0.06em">● OHNE INHALTE</span></sc-if>
                </span>
              </td>
              <td style="padding: 14px 16px; border-top: 1px solid #E3E4E7"><span style="display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #43454F"><span><strong style="color: #1B1D26">{{r.docs}}</strong> Dokumente · <strong style="color: #1B1D26">{{r.links}}</strong> Links</span><span><strong style="color: #1B1D26">{{r.contacts}}</strong> Ansprechpartner</span></span></td>
              <td style="padding: 14px 16px; border-top: 1px solid #E3E4E7; font-size: 13px">{{r.staff}}</td>
              <td style="padding: 14px 16px; border-top: 1px solid #E3E4E7; font-weight: 700">{{r.vis}}</td>
              <td style="padding: 14px 16px; border-top: 1px solid #E3E4E7; text-align: right"><a href="{{r.href}}" style="color: #00846D; text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap">Bearbeiten →</a></td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
    <span style="font-size: 13px; color: #5E606C">6 Exponate</span>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { id: 'E01', name: 'Modulare Anlage mit MTP', docs: 4, links: 2, contacts: 1, vis: 64, staff: 'Markus Ebeling' },
      { id: 'E02', name: 'NOA Monitoring', docs: 4, links: 1, contacts: 1, vis: 58, staff: 'Sophie Brandt' },
      { id: 'E03', name: 'Ethernet-APL Feldgeräte', docs: 4, links: 2, contacts: 2, vis: 81, staff: 'Jana Lindqvist, Okan Demir' },
      { id: 'E04', name: 'Ventilinsel mit Diagnose', docs: 3, links: 0, contacts: 1, vis: 47, staff: 'Jana Lindqvist' },
      { id: 'E05', name: 'Verwaltungsschale im Engineering', docs: 2, links: 0, contacts: 1, vis: 29, staff: 'Tobias Reichert' },
      { id: 'E06', name: 'Alarmmanagement nach NA 102', docs: 0, links: 0, contacts: 0, vis: 0, staff: 'Tobias Reichert', empty: true }
    ].map((r) => ({ ...r, empty: !!r.empty, href: r.empty ? 'ExhibitEmpty.dc.html' : 'ExhibitDetail.dc.html' }));
    return { yes: true, rows };
  }
}
</script>
</body>
</html>
