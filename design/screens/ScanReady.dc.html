<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bereit zum Scannen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Raleway:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #EFEFEF; color: #1B1D26; font-family: Raleway, 'Helvetica Neue', sans-serif">
  <dc-import name="AppHeader" active="exhibits" admin="{{no}}" user="J. Lindqvist" hint-size="390px,104px"></dc-import>
  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <a href="ScanPick.dc.html" style="align-self: flex-start; height: 40px; display: flex; align-items: center; color: #43454F; text-decoration: none; font-size: 14px; font-weight: 500">← Exponate</a>
    <span style="display: flex; align-items: center; gap: 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px">E03</span><span style="font-size: 13px; color: #43454F">81 Besucher zugeordnet</span></span>
    <h1 style="margin: 0; font-weight: 700; font-size: 28px; letter-spacing: -0.02em; line-height: 1.12">Ethernet-APL Feldgeräte</h1>
  </div>
  <section aria-labelledby="h-recent" style="flex: 1; min-height: 0; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <h2 id="h-recent" style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5E606C">Zuletzt hier zugeordnet</h2>
    <div style="display: flex; flex-direction: column; background: #FFFFFF; box-shadow: 0 2px 6px rgba(27,29,38,0.07)">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="min-height: 60px; padding: 8px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #E3E4E7">
          <span style="width: 40px; height: 40px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #1B1D26; color: #FFFFFF; font-size: 13px; font-weight: 700">{{r.ini}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
            <span style="font-size: 13px; color: #43454F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.firm}}</span>
          </span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #43454F">{{r.t}}</span>
        </div>
      </sc-for>
    </div>
  </section>
  <div style="padding: 16px 16px 28px">
    <a href="ScanCamera.dc.html" style="height: 68px; display: flex; align-items: center; justify-content: center; gap: 12px; border-radius: 999px; background: #00A587; color: #FFFFFF; text-decoration: none; font-size: 19px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><rect x="7" y="7" width="4" height="4"></rect><rect x="13" y="13" width="4" height="4"></rect></svg>
      Pass scannen
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { ini: 'HF', name: 'Dr. Henrik Faller', firm: 'Rheinchem Werke GmbH', t: '14:32' },
      { ini: 'AK', name: 'Aylin Kaya', firm: 'Westfalen Polymer GmbH', t: '14:21' },
      { ini: 'JA', name: 'Jonas Albrecht', firm: 'Main-Taunus Verfahrenstechnik', t: '14:09' },
      { ini: 'PS', name: 'Petra Schönfeld', firm: 'Hanseatic Agro Chemie GmbH', t: '13:58' }
    ];
    return { no: false, rows };
  }
}
</script>
</body>
</html>
